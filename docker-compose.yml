# Execução local: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: livros
      POSTGRES_PASSWORD: livros
      POSTGRES_DB: livros
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U livros']
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgres://livros:livros@db:5432/livros
    ports: ['3000:3000']
    depends_on:
      db:
        condition: service_healthy
